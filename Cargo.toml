[workspace]
resolver = "2"
members = [
    "crates/backup-core",
    "crates/backup-storage",
    "crates/backup-local",
    "crates/backup-drive",
    "apps/agent",
    "apps/desktop",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
globset = "=0.4.15"
blake3 = "=1.8.2"
libc = "0.2"
notify = "8.2"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "=3.10.1"
thiserror = "2.0"
