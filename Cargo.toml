[workspace]
resolver = "2"
members = [
    "crates/backup-core",
    "crates/backup-storage",
    "crates/backup-local",
    "crates/backup-drive",
    "apps/agent",
    "apps/desktop",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
globset = "=0.4.15"
blake3 = "=1.8.2"
libc = "0.2"
notify = "8.2"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "=3.10.1"
thiserror = "2.0"
base64 = "=0.22.1"
rand = "=0.8.5"
sha2 = "=0.10.8"
ureq = { version = "=2.11.0", features = ["json"] }
url = "=2.5.8"
md-5 = "=0.10.6"
httpdate = "=1.0.3"
tauri = "=2.12.3"
tauri-build = "=2.7.2"
tauri-plugin-opener = "=2.6.0"
