<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>RustBackup</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">RUSTBACKUP</p>
          <h1>云端账户</h1>
        </div>
        <span class="environment">测试环境</span>
      </header>

      <section class="card" aria-labelledby="drive-title">
        <div class="card-heading">
          <div class="drive-mark" aria-hidden="true">G</div>
          <div>
            <h2 id="drive-title">Google Drive</h2>
            <p class="muted">通过 Google 官方授权连接备份账户</p>
          </div>
        </div>

        <div id="connection" class="connection" role="status" aria-live="polite">
          正在读取账户状态…
        </div>

        <button id="connect" class="primary" type="button" disabled>
          连接 Google Drive
        </button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>

      <aside class="notice">
        <strong>此步骤只连接账户。</strong>
        <span>不会启用任务、扫描文件、创建云端文件夹或上传文件。之后仍需选择并确认测试源目录和专用云端目录。</span>
      </aside>

      <footer>授权令牌仅保存到 Windows 凭据管理器。</footer>
    </main>
  </body>
</html>
